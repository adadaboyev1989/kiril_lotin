name: O'rnatuvchini yig'ish

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Reliz tegi (masalan v1.1.0). Bo'sh qoldirilsa reliz yaratilmaydi."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Qoidalar va generator testlari
        run: |
          pip install olefile
          python3 -m unittest discover -s tests -v

      - name: Word va Excel qo'shimchalarini yasash
        run: python3 installer/build_addins.py

      - name: NSIS ni o'rnatish
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: KirillLotin-Setup.exe ni yig'ish
        run: makensis -V2 installer/KirillLotin.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: KirillLotin-Setup
          path: dist/KirillLotin-Setup.exe

      - name: Relizga qo'shish (v* teglari yoki qo'lda ishga tushirilganda)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Kirill-Lotin ${{ inputs.release_tag || github.ref_name }}
          body_path: installer/RELEASE_NOTES.md
          make_latest: true
          files: |
            dist/KirillLotin-Setup.exe
            addins/KirillLotin.dotm
            addins/KirillLotin.xlam
